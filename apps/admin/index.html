<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>sw-backupit – dev (simulated wp-admin)</title>
        <!--
      Development host page. Simulates the relevant wp-admin chrome and a few hostile global
      styles so style isolation can be verified. It is NOT part of the production build.
    -->
        <style>
            html {
                --wp-admin--admin-bar--height: 32px;
            }
            body {
                margin: 0;
                background: #f0f0f1;
                color: #3c434a;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 13px;
                line-height: 1.4em;
                min-width: 0;
            }
            a {
                color: #2271b1;
                text-decoration: underline;
            }
            h1,
            h2,
            h3 {
                margin: 1em 0;
                padding: 0;
                color: #1d2327;
                font-weight: 400;
            }
            h1 {
                font-size: 23px;
            }
            p {
                font-size: 13px;
                line-height: 1.5;
                margin: 1em 0;
            }
            ul,
            ol {
                padding: 0;
                margin: 0;
                list-style: disc inside;
            }
            input[type='text'],
            input[type='number'],
            input[type='search'],
            input[type='password'],
            input[type='time'],
            select,
            textarea {
                box-shadow: 0 0 0 transparent;
                border-radius: 4px;
                border: 1px solid #8c8f94;
                background-color: #fff;
                color: #2c3338;
                padding: 0 8px;
                min-height: 30px;
                font-size: 14px;
            }
            button {
                font-size: 13px;
            }
            label {
                display: block;
                margin-bottom: 4px;
                font-weight: 600;
            }
            table {
                border-spacing: 0;
                width: 100%;
                clear: both;
                margin: 0;
            }
            th,
            td {
                padding: 8px 10px;
                background: #fff;
                text-align: left;
            }
            code {
                background: rgba(0, 0, 0, 0.07);
                padding: 3px 5px;
                margin: 0 1px;
                font-size: 13px;
            }
            #wpadminbar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 32px;
                background: #1d2327;
                color: #fff;
                z-index: 99999;
                padding: 7px 12px;
                box-sizing: border-box;
            }
            #adminmenuwrap {
                position: fixed;
                top: 32px;
                bottom: 0;
                left: 0;
                width: 160px;
                background: #1d2327;
                z-index: 9990;
            }
            #wpcontent {
                margin-left: 160px;
                padding-left: 20px;
                padding-top: 32px;
            }
            #wpbody-content {
                padding-bottom: 65px;
            }
            #wpfooter {
                padding: 10px 20px;
                color: #50575e;
            }
            @media screen and (max-width: 782px) {
                html {
                    --wp-admin--admin-bar--height: 46px;
                }
                #adminmenuwrap {
                    display: none;
                }
                #wpcontent {
                    margin-left: 0;
                    padding-left: 10px;
                    padding-top: 46px;
                }
                #wpadminbar {
                    height: 46px;
                }
            }
        </style>
        <script>
            // Equivalent of what the PHP admin page prints before the module script.
            window.swbackupitConfig = {
                restRoot: location.origin + '/wp-json/sw-backupit/v1/',
                nonce: 'dev-nonce',
                locale:
                    new URLSearchParams(location.search).get('lang') === 'en' ? 'en_US' : 'de_DE',
                version: '0.1.0-dev',
                adminUrl: location.origin + '/wp-admin/',
                capabilities: (
                    new URLSearchParams(location.search).get('caps') ||
                    'swbi_view,swbi_run,swbi_manage_profiles,swbi_manage_storage,swbi_download,swbi_delete,swbi_restore,swbi_settings'
                ).split(','),
                siteUrl: 'https://example.com',
            };
        </script>
    </head>
    <body class="wp-admin wp-core-ui">
        <div id="wpadminbar">WordPress admin bar (simulated)</div>
        <div id="adminmenuwrap"></div>
        <div id="wpcontent">
            <div id="wpbody-content">
                <div id="sw-backupit-app"></div>
            </div>
            <div id="wpfooter">Thank you for creating with WordPress. (simulated footer)</div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
