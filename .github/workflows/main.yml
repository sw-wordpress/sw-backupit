name: Build signed release

# Builds the installable ZIP, uploads it to a DRAFT release, signs the exact uploaded assets and only then publishes.
# Runs no test suites (those run on pull requests). Needs the protected environment `plugin-releases` with the secret
# SW_PLUGIN_RELEASE_SIGNING_KEY and the variable SW_PLUGIN_RELEASE_KEY_ID (docs/github-updates.md).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  PLUGIN_SLUG: sw-backupit

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    environment: plugin-releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine and validate version
        id: metadata
        run: |
          RAW="${GITHUB_REF_NAME}"
          # Only stable tags the runtime verifier accepts: [v]X.Y.Z[.W][-NN]
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+(\.[0-9]+){2,3}(-[0-9]{2})?$'; then
            echo "Tag '$RAW' is not a stable release tag (expected [v]X.Y.Z[.W][-NN])." >&2
            exit 1
          fi
          VERSION="${RAW#v}"
          VERSION="${VERSION%-*}"
          HEADER="$(grep -m1 -E '^\s*\*?\s*Version:' sw-backupit.php | awk '{print $NF}' | tr -d '\r')"
          CONSTANT="$(grep -m1 "define( 'SWBACKUPIT_VERSION'" sw-backupit.php | sed -E "s/.*'([0-9.]+)'.*/\1/")"
          echo "tag=$VERSION header=$HEADER constant=$CONSTANT"
          if [ "$VERSION" != "$HEADER" ] || [ "$VERSION" != "$CONSTANT" ]; then
            echo "Tag, plugin header and SWBACKUPIT_VERSION must be identical" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=${PLUGIN_SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, pdo_mysql, mbstring, sodium
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # Aborts (before anything is built or published) when the secret or key ID is missing.
      - name: Embed public verification key
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php public-key packages/wordpress/src/Update/Config/trusted-keys.php

      - name: Build ZIP
        run: bash bin/build-zip.sh "$RUNNER_TEMP/dist"

      - name: Verify ZIP contents
        env:
          ZIP_FILE: ${{ steps.metadata.outputs.zip }}
          KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: |
          shopt -s nullglob
          ZIPS=("$RUNNER_TEMP"/dist/*.zip)
          [ "${#ZIPS[@]}" -eq 1 ] || { echo "Expected exactly one ZIP" >&2; exit 1; }
          bash bin/verify-zip.sh "${ZIPS[0]}" "$ZIP_FILE"

      - name: Upload package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # An already published release is immutable: never overwrite it.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            php -r '$r=json_decode(file_get_contents($argv[1]),true); exit(empty($r["isDraft"])?1:0);' "$RUNNER_TEMP/existing-release.json" \
              || { echo "Release $RELEASE_TAG is already published; refusing to modify it." >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/dist/*.zip --clobber
          # The tag endpoint does not resolve drafts; gh release view also searches draft releases.
          RELEASE_API_URL="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$RELEASE_API_URL" > "$RUNNER_TEMP/release.json"

      - name: Sign exact uploaded package
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php sign "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/dist" "$GITHUB_SHA"

      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dist/sw-plugin-release.json" "$RUNNER_TEMP/dist/sw-plugin-release.json.sig" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
