name: Tests and SonarQube
# Test suites run on pull requests only (the release workflow runs none).
on:
  pull_request: null

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: coverage
      SWBI_TEST_DB_HOST: 127.0.0.1
      SWBI_TEST_DB_PORT: '33077'
      SWBI_TEST_DB_USER: root
      SWBI_TEST_DB_PASSWORD: wordpress-test
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, sodium, zip, gd
        tools: composer:v2
        coverage: xdebug
    - run: composer install --prefer-dist --no-interaction --no-progress
    - run: composer validate --strict
    - name: Audit shipped Composer packages
      run: |
        if [ "$(php -r 'echo count(json_decode(file_get_contents("composer.lock"), true)["packages"]);')" = 0 ]; then
          echo 'No runtime Composer packages are shipped; nothing to audit.'
        else
          composer audit --locked --no-dev
        fi
    - run: composer cs && composer cs:wp && composer stan
    - name: Install isolated WordPress test dependencies
      run: composer install --working-dir=tests/wp --prefer-dist --no-interaction --no-progress
    - name: Unit and integration coverage
      run: |-
        mkdir -p coverage
        vendor/bin/phpunit --testsuite unit,integration --coverage-clover coverage/unit.xml
    - name: WordPress coverage
      working-directory: tests/wp
      run: vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover ../../coverage/wordpress.xml
    - name: Multisite capability coverage
      working-directory: tests/wp
      run: vendor/bin/phpunit -c phpunit-ms.xml.dist --filter MultisiteTest --coverage-filter ../../packages/wordpress/src --coverage-clover ../../coverage/multisite.xml
    # The multisite suite and the browser/ZIP checks share the disposable test database: keep these steps sequential.
    - name: Verified GitHub updates on multisite (network rights, admin-ajax.php)
      working-directory: tests/wp
      run: vendor/bin/phpunit -c phpunit-ms.xml.dist --filter VerifiedUpdatesTest
    - name: Backup and restore scenarios
      run: vendor/bin/phpunit --testsuite e2e --coverage-clover coverage/e2e.xml
    - name: Merge and normalize Clover paths
      run: php tests/coverage/merge.php coverage/unit.xml coverage/wordpress.xml coverage/e2e.xml coverage/multisite.xml
    - name: Enforce PHP line coverage > 80 %
      run: php tests/coverage/check.php coverage/clover.xml 80
    - name: Upload Clover coverage
      uses: actions/upload-artifact@v7
      with:
        name: php-coverage
        path: coverage/clover.xml
        if-no-files-found: error
        retention-days: 14
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress-test
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: swbi_wp_tests
        ports:
        - 33077:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
  release-package:
    name: Real build ZIP and signing tool
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, sodium, zip, pdo_mysql
        tools: composer:v2
        coverage: none
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: bash bin/build-zip.sh "$RUNNER_TEMP/dist"
    - name: Sign the real ZIP with a disposable key and verify it with the runtime verifier
      run: php tests/release/verify-signed-build.php "$RUNNER_TEMP/dist"
  frontend:
    # Playwright 1.55.1 supports Ubuntu 24.04, but not the 26.04 latest image.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/admin
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: npm ci
    - run: npm audit --omit=dev --audit-level=high
    - run: npm run lint && npm run typecheck
    - name: Tests with strict line coverage > 80 %
      run: npm run test:coverage
    - run: npm run build
    - name: Update check script in a real browser (coverage > 80 %)
      run: |
        npx playwright-core install --with-deps chromium
        npm run test:updates-ui
    - name: Upload lcov coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: apps/admin/coverage/lcov.info
        if-no-files-found: error
        retention-days: 14
  sonarqube:
    name: SonarQube Cloud
    needs:
    - php
    - frontend
    - release-package
    if: |-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: php-coverage
        path: coverage
    - uses: actions/download-artifact@v8
      with:
        name: frontend-coverage
        path: apps/admin/coverage
    - name: Check SonarQube configuration
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::Set the SONAR_TOKEN repository secret before running SonarQube analysis.'
          exit 1
        fi
        if [ -z "$SONAR_ORGANIZATION" ]; then
          echo '::error::Set the SONAR_ORGANIZATION repository variable to your SonarQube Cloud organization key.'
          exit 1
        fi
        test -s coverage/clover.xml
        test -s apps/admin/coverage/lcov.info
    - name: Analyze code and import coverage
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
      with:
        args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
