name: Documentation

on:
  pull_request:
    paths:
      - 'pages/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build documentation outside the checkout
        env:
          DOCS_BUILD: ${{ runner.temp }}/sw-backupit-docs
        run: |
          mkdir -p "$DOCS_BUILD"
          cp -R pages "$DOCS_BUILD/pages"
          npm install --prefix "$DOCS_BUILD" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund vitepress@1.6.4
          "$DOCS_BUILD/node_modules/.bin/vitepress" build "$DOCS_BUILD/pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/sw-backupit-docs/pages/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: sw-backupit-github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
